name: External links

on:
  schedule:
    - cron: '20 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/check_external_links.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-link-report
          path: outputs/link-report.json
          retention-days: 30
